name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  # Go CI
  go-test:
    name: Go Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.23', '1.24', '1.25']
    
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        if: matrix.go-version == '1.23'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
          flags: go
          name: go-coverage

  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.6.1
          args: --timeout=5m

  go-security:
    name: Go Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache: true

      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: '-no-fail -fmt sarif -out results.sarif ./...'

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif

  # The discovery modules are separate Go modules, so `go test ./...` at the
  # repo root never reaches them. Without this job their first build is the
  # post-merge release, where a failure has already landed on main.
  discovery:
    name: Discovery Modules
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          # discovery/etcd and discovery/mdns declare go 1.25.0. setup-go pins
          # GOTOOLCHAIN=local, so this must be >= the highest directive across
          # the discovery modules.
          go-version: '1.25'
          cache: true
          cache-dependency-path: discovery/**/go.sum

      - name: Vet and test every discovery module
        run: |
          set -uo pipefail
          failed=0
          while IFS= read -r modfile; do
            dir=$(dirname "$modfile")
            echo "=== $dir ==="
            if ! ( cd "$dir" && go vet ./... && go test -race ./... ); then
              echo "::error::discovery module $dir failed"
              failed=1
            fi
          done < <(find discovery -name go.mod | sort)
          exit $failed

  # Rust CI
  rust-test:
    name: Rust Tests
    uses: xraph/workflows/.github/workflows/rust-ci.yml@v1
    with:
      working-directory: farp-rust
      run-extended: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # Restores the per-PR `cargo doc` the pre-migration job ran. Without it a
      # broken intra-doc link first surfaces at `cargo publish`.
      build-docs: true
      docs-artifact-name: farp-rust-docs

  # Example verification
  examples:
    name: Verify Examples
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache: true

      - name: Build basic example
        run: |
          cd examples/basic
          go build -v .

  # Verify no forbidden patterns
  quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Check for TODOs in main branch
        if: github.ref == 'refs/heads/main'
        run: |
          if grep -r "TODO\|FIXME\|XXX" --include="*.go" --exclude-dir=vendor  --exclude-dir=examples .; then
            echo "Found TODO/FIXME/XXX in main branch"
            exit 1
          fi

      - name: Check for debug statements
        run: |
          if grep -r "fmt.Print\|log.Print" --include="*.go" --exclude-dir=vendor --exclude="*_test.go" --exclude-dir=examples .; then
            echo "Found debug print statements in production code"
            exit 1
          fi

